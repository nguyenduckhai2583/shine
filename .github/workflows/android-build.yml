name: Android Build

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Build Environment'
        default: 'dev'
        options:
          - dev
          - prod
      buildType:
        type: choice
        description: 'Build Type'
        default: 'debug'
        options:
          - debug
          - release

jobs:
  build:
    name: Build (${{ inputs.environment }} - ${{ inputs.buildType }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Inject environment secrets in-place into properties file and print configuration
      - name: Inject Secrets into Environment File
        env:
          PASSWORD_SALT: ${{ secrets.PASSWORD_SALT }}
        run: |
          ENV_FILE="app/env/${{ inputs.environment }}.properties"
          SECRET_KEYS=(PASSWORD_SALT)
          for key in "${SECRET_KEYS[@]}"; do
            val="${!key}"
            if [ -n "$val" ]; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
            fi
          done
          echo "=== Final $ENV_FILE ==="
          cat "$ENV_FILE"

      # Decode Release Keystore if building release and secret is available
      - name: Setup Keystore
        if: inputs.buildType == 'release' && secrets.KEY_STORE_BASE64 != ''
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
        run: |
          echo "$KEY_STORE_BASE64" | base64 --decode > app/keystore.jks

      # Build APK for debug or AAB (Android App Bundle) for release
      - name: Build with Gradle
        run: |
          if [ "${{ inputs.buildType }}" == "release" ]; then
            ./gradlew bundle${{ inputs.environment }}Release --stacktrace
          else
            ./gradlew assemble${{ inputs.environment }}Debug --stacktrace
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shine-${{ inputs.environment }}-${{ inputs.buildType }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          retention-days: 14
